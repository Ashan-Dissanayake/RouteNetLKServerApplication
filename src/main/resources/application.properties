spring.application.name=RouteNetLKServerApplication

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.mvc.format.date=yyyy-MM-dd

# Security & Login Configuration
security.login.max-attempts=5
security.login.block-duration-minutes=15

# OptaPlanner Logging
logging.level.org.optaplanner.core.impl.constructionheuristic=DEBUG
logging.level.org.optaplanner.core.impl.phase=DEBUG

spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Thymeleaf Configuration
spring.thymeleaf.prefix=classpath:/templates/email
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.info.env.enabled=true