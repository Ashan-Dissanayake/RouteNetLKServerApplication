spring.application.name=RouteNetLKServerApplication

# Active Profile (defaults to 'dev' if not specified)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/routenetlk}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234}

spring.mvc.format.date=yyyy-MM-dd

logging.level.org.optaplanner.core.impl.constructionheuristic=DEBUG
logging.level.org.optaplanner.core.impl.phase=DEBUG

# JWT Configuration
jwt.secret=${JWT_SECRET:M2s5Zkoybm1QOHZSNWBXN3hUMXFMNHlVNmhCMHpDOGVBOXNEMmZHNWpIN2tO}
jwt.expiration=${JWT_EXPIRATION:86400000}

# In-Memory Admin User
spring.security.user.name=${ADMIN_USER_NAME:routeNetLKAdmin}
spring.security.user.password=${ADMIN_USER_PASSWORD:routeNetLKPWD@2026}

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Security Configuration
security.login.max-attempts=5
security.login.block-duration-minutes=15

# Logging
logging.level.lk.ashan.routenetlkserverapllication=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.ai.timefold.solver=INFO

# Email Service Properties
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:ashanpathum899@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Thymeleaf Configuration
spring.thymeleaf.prefix=classpath:/templates/email
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

