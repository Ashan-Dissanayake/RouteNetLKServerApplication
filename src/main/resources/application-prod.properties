spring.datasource.url=${DB_URL:jdbc:mysql://production-db-host:3306/routenetlk}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Admin User
spring.security.user.name=${ADMIN_USER_NAME:admin}
spring.security.user.password=${ADMIN_USER_PASSWORD}

# CORS for Production Frontend Domain
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://yourdomain.lk}

# Email Credentials
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

logging.level.root=WARN
logging.level.lk.ashan.routenetlkserverapllication=INFO
logging.level.org.springframework.security=WARN
logging.level.ai.timefold.solver=INFO