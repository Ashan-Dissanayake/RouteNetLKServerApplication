# Hibernate & Schema DDL
spring.jpa.hibernate.ddl-auto=none
spring.jpa.defer-datasource-initialization=true

# Force schema.sql & data.sql to run against MySQL Testcontainer
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# Fallback/Dummy Test DataSource settings (overridden by Testcontainers @DynamicPropertySource)
spring.datasource.url=jdbc:mysql://localhost:3306/routenetlk_test
spring.datasource.username=test
spring.datasource.password=test

