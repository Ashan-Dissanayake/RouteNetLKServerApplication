# Name of your Spring Boot application (optional)
spring.application.name=RouteNetLKServerApplication

# Hibernate & JPA config
spring.jpa.hibernate.ddl-auto=none
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true

# SQL initialization (optional if using @Sql)
spring.sql.init.mode=never

# Date format
spring.mvc.format.date=yyyy-MM-dd

# You could also add logging levels for tests
#logging.level.org.springframework.jdbc.core=DEBUG
#logging.level.org.hibernate.SQL=DEBUG

# Optional: To see the solving progress in your console
logging.level.ai.timefold.solver=INFO
