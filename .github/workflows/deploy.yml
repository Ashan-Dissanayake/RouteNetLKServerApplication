name: CI/CD Pipeline - RouteNetLK Backend

on:
  push:
    branches:
      - master
    paths-ignore:
      - .gitignore
      - README.md
      - .dockerignore
      - HELP.md
  pull_request:
    branches:
      - master
    paths-ignore:
      - .gitignore
      - README.md
      - .dockerignore
      - HELP.md
  workflow_dispatch:

jobs:
  # ==========================================================
  # STAGE 1: Automated Unit & Integration Testing
  # ==========================================================
  run-tests:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Log in to Docker Hub (for Testcontainers)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Grant Execute Permission for mvnw
        run: chmod +x mvnw

      - name: Run Maven Tests (with Test Profile)
        run: ./mvnw test -Dspring.profiles.active=test


  # ==========================================================
  # STAGE 2: Build & Deploy to AWS (Runs ONLY if tests pass on master branch)
  # ==========================================================
  build-and-deploy:
    name: Build, Push & Deploy Backend
    needs: run-tests
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Backend Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/routenet-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/routenet-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ==========================================================
      # Deploy to AWS EC2 via SSH
      # ==========================================================
      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/RouteNetLK
            export DOCKERHUB_USERNAME="${{ secrets.DOCKERHUB_USERNAME }}"
            
            # Pull only updated backend image
            docker compose pull backend
            
            # Recreate backend container without touching other services
            docker compose up -d --no-deps backend
            
            # Remove old dangling images
            docker image prune -f

