name: CI/CD Pipeline - RouteNetLK Backend

on:
  push:
    branches:
      - master
    paths-ignore:
      - .gitignore
      - README.md
      - .dockerignore
      - HELP.md
  pull_request:
    branches:
      - master
    paths-ignore:
      - .gitignore
      - README.md
      - .dockerignore
      - HELP.md
  workflow_dispatch:

jobs:
  # ==========================================================
  # STAGE 1: Unit Tests Only (No Docker/Testcontainers required)
  # Repository Integration Tests should be run locally with Docker Desktop
  # ==========================================================
  run-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Grant Execute Permission for mvnw
        run: chmod +x mvnw

      - name: Run Unit Tests (CI profile - excludes Testcontainer tests)
        run: ./mvnw test -Pci
        env:
          SPRING_PROFILES_ACTIVE: test


  # ==========================================================
  # STAGE 2: Build & Deploy to AWS (Runs ONLY if tests pass on master branch)
  # ==========================================================
  build-and-deploy:
    name: Build, Push & Deploy Backend
    needs: run-tests
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest

    # Required for GitHub OIDC -> AWS role assumption
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Backend Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/routenet-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/routenet-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ==========================================================
      # Deploy to AWS EC2 via SSM (no SSH / no open port 22)
      # ==========================================================
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Deploy to AWS EC2 via SSM
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy backend ${{ github.sha }}" \
            --parameters 'commands=[
              "set -e",
              "cd /home/ubuntu/routenet-live",
              "export DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}",
              "docker compose pull backend",
              "docker compose up -d --no-deps backend",
              "docker image prune -f"
            ]' \
            --query "Command.CommandId" --output text)

          aws ssm wait command-executed \
            --command-id "$CMD_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" || FAILED=1

          aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query '[Status,StandardOutputContent,StandardErrorContent]' \
            --output text

          [ -z "$FAILED" ] || exit 1